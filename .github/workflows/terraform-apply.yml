name: terraform apply

on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read

# Without this, two merges landing close together spawn two parallel apply
# jobs against the same remote state. use_lockfile makes the second one fail
# outright on a lock error rather than corrupt state, but that's a confusing
# failure to debug -- queue them instead so the second run applies cleanly
# against the first run's result.
concurrency:
  group: terraform-apply-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.0" # must be >= 1.10 -- see envs/prod/providers.tf
  AWS_REGION: ap-southeast-7

jobs:
  apply:
    runs-on: ubuntu-latest
    # The `prod` GitHub Environment's required reviewer is the gate. The OIDC
    # trust policy only accepts tokens with sub=...:environment:prod, so without
    # an approval no credentials are ever issued.
    environment: prod

    defaults:
      run:
        working-directory: envs/prod


    env:
      # terraform.tfvars is gitignored, so values come from GitHub repository
      # variables (Settings > Secrets and variables > Actions > Variables).
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_admin_email: ${{ vars.ADMIN_EMAIL }}
      TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
      TF_VAR_enable_ssh: ${{ vars.ENABLE_SSH }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Apply
        run: terraform apply -auto-approve -input=false
